; PHP limits for cPanel / shared hosting (CGI, FastCGI, FPM, LSAPI read this file automatically)
; lets admins upload larger photos / videos and run image imports without timeouts
upload_max_filesize = 64M
post_max_size = 72M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
max_file_uploads = 40
